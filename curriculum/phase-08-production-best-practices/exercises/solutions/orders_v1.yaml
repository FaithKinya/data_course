dataset: orders
version: v1
owner: data-engineering
description: ShopStream daily order export consumed by analytics pipelines.
sla:
  freshness_hours: 24
  availability: business_days
schema:
  - name: order_id
    type: integer
    required: true
    unique: true
  - name: customer_id
    type: integer
    required: true
  - name: product_id
    type: integer
    required: true
  - name: order_date
    type: date
    required: true
  - name: quantity
    type: integer
    required: true
    min_value: 1
  - name: unit_price
    type: float
    required: true
    min_value: 0
  - name: status
    type: string
    required: true
    allowed_values:
      - completed
      - cancelled
      - refunded
